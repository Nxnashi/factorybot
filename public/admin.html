<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — учёт производства</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f2ee);
    --surface: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --accent: var(--tg-theme-button-color, #c4622d);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: #e2ddd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .tabs-wrap {
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .tabs-wrap::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 28px;
    background: linear-gradient(to right, transparent, var(--surface));
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .tabs-wrap.at-end::after { opacity: 0; }
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 14px 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--hint);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab.active { color: var(--text); border-color: var(--accent); }
  section { display: none; padding: 16px; }
  section.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .card .row1 { font-weight: 700; font-size: 14px; }
  .card .row2 { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .card .actions { display: flex; gap: 8px; margin-top: 8px; }
  .card .actions button {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
  }
  .card .actions button.danger { color: #b3372c; border-color: #b3372c; }

  form.inline {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  form.inline label {
    display: block;
    font-size: 12px;
    color: var(--hint);
    margin: 8px 0 4px;
  }
  form.inline input, form.inline select {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  form.inline button {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }
  .stage-checkboxes {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stage-checkbox-item {
    display: flex !important;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 0 !important;
  }
  .stage-checkbox-item input { width: auto !important; }

  .export-form input[type="date"] { margin-bottom: 8px; }
  .state-screen { padding: 60px 24px; text-align: center; color: var(--hint); }

  .stage-card .row1 { font-size: 15px; margin-bottom: 10px; }
  .employee-block {
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .employee-block:first-of-type { border-top: none; }
  .employee-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .employee-time {
    font-size: 11px;
    font-weight: 400;
    color: var(--hint);
  }
  .item-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    padding: 3px 0 3px 10px;
    color: var(--text);
  }
  .item-line span:last-child { font-weight: 700; }
  .item-line.total { padding-left: 0; }
  .item-line .right { display: flex; align-items: center; gap: 8px; font-weight: 400; }
  .item-line .entry-time { font-size: 11px; color: var(--hint); font-weight: 400; }
  .item-line .del-btn {
    border: none;
    background: none;
    color: #b3372c;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
  }
  .stage-total {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }

  .balance-card .row1 { margin-bottom: 8px; }
  .balance-stage-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
    border-top: 1px solid var(--line);
  }
  .balance-stage-line:first-of-type { border-top: none; }
  .balance-stage-line span:last-child { font-weight: 700; }
  .balance-deltas-block {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .balance-delta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 8px;
    margin-bottom: 4px;
  }
  .balance-delta.ok { background: rgba(60, 160, 90, 0.12); color: #3ca05a; }
  .balance-delta.warn { background: rgba(179, 55, 44, 0.12); color: #b3372c; }
  .balance-delta.over { background: rgba(196, 98, 45, 0.12); color: var(--accent); }
  .balance-delta span:last-child { font-weight: 700; }

  .balance-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .balance-table {
    border-collapse: collapse;
    width: 100%;
    min-width: 640px;
    font-size: 12px;
  }
  .balance-table th, .balance-table td {
    padding: 9px 10px;
    text-align: center;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  .balance-table th:last-child, .balance-table td:last-child { border-right: none; }
  .balance-table thead th {
    background: #EFEAE0;
    font-weight: 700;
    font-size: 11px;
    color: var(--hint);
    white-space: normal;
    max-width: 90px;
  }
  .balance-table .row-label {
    text-align: left;
    font-weight: 700;
    white-space: normal;
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 1;
  }
  .balance-table thead th:first-child {
    text-align: left;
    position: sticky;
    left: 0;
    z-index: 2;
  }
  .balance-table tr.row-total td {
    font-weight: 700;
    background: #EFEAE0;
    border-top: 2px solid var(--line);
  }
  .balance-table td.cell-warn { background: rgba(179, 55, 44, 0.15); color: #b3372c; font-weight: 700; }
  .balance-table td.cell-over { background: rgba(196, 98, 45, 0.15); color: var(--accent); font-weight: 700; }

  .cell-sub { font-size: 10px; font-weight: 400; color: var(--hint); }
  .cell-sub.bad { color: #b3372c; }
  .op-code { font-size: 10px; color: var(--hint); font-family: monospace; }
  .matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .matrix { border-collapse: collapse; font-size: 12px; min-width: 100%; }
  .matrix th, .matrix td { padding: 7px 9px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; text-align: right; }
  .matrix th { background: #EFEAE0; font-size: 11px; color: var(--hint); }
  .matrix td.name, .matrix th.name { text-align: left; white-space: normal; min-width: 170px; position: sticky; left: 0; background: var(--surface); }
  .matrix th.name { background: #EFEAE0; }
  .matrix tr.total td { font-weight: 700; background: #EFEAE0; }
  .matrix .meta td { font-size: 10px; color: var(--hint); }
  .posting { border-left: 3px solid var(--accent); }
  .posting.cancelled { opacity: .55; border-left-color: #b3372c; }
  .posting .code { font-family: monospace; font-weight: 700; font-size: 12px; }
  .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .balance-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    color: var(--hint);
    margin-bottom: 10px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend-swatch.warn { background: rgba(179, 55, 44, 0.4); }
  .legend-swatch.over { background: rgba(196, 98, 45, 0.4); }

  .day-status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 12px;
  }
  .day-status-bar.open {
    background: rgba(196, 98, 45, 0.12);
    color: var(--accent);
  }
  .day-status-bar.closed {
    background: rgba(60, 160, 90, 0.12);
    color: #3ca05a;
  }
  .day-status-bar button {
    border: 1px solid currentColor;
    background: none;
    color: inherit;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    font-weight: 700;
  }
  .open-days-list .item-line { padding-left: 0; }
  .date-dmy-hint {
    font-size: 11px;
    color: var(--hint);
    margin-left: 6px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="app"><div class="state-screen">Загрузка…</div></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

function formatDMY(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function attachDateHints(root) {
  root.querySelectorAll('input[type="date"]').forEach(input => {
    if (input.dataset.hintAttached) return;
    input.dataset.hintAttached = '1';
    const hint = document.createElement('span');
    hint.className = 'date-dmy-hint';
    hint.textContent = formatDMY(input.value);
    input.insertAdjacentElement('afterend', hint);
    input.addEventListener('input', () => { hint.textContent = formatDMY(input.value); });
  });
}
new MutationObserver(() => attachDateHints(document.body)).observe(document.body, { childList: true, subtree: true });
attachDateHints(document.body);

function getTelegramId() {
  const fromTg = tg?.initDataUnsafe?.user?.id;
  if (fromTg) return String(fromTg);
  const params = new URLSearchParams(location.search);
  return params.get('tid');
}

function todayLocal() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tashkent' }).format(new Date());
}
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const telegramId = getTelegramId();
const app = document.getElementById('app');

function authHeaders() {
  return { 'Content-Type': 'application/json', 'x-telegram-id': telegramId };
}

async function boot() {
  if (!telegramId) {
    app.innerHTML = `<div class="state-screen">Не удалось определить пользователя.</div>`;
    return;
  }
  const stagesRes = await fetch('/api/admin/stages', { headers: authHeaders() });
  if (stagesRes.status === 403 || stagesRes.status === 401) {
    app.innerHTML = `<div class="state-screen">Доступ только для администраторов.<br>Твой ID: <b>${telegramId}</b></div>`;
    return;
  }
  const stages = await stagesRes.json();
  render(stages);
}

function render(stages) {
  app.innerHTML = `
    <div class="tabs-wrap">
      <div class="tabs">
        <div class="tab active" data-tab="shifts">Смены</div>
        <div class="tab" data-tab="mixing">Замесы</div>
        <div class="tab" data-tab="balance">Баланс</div>
        <div class="tab" data-tab="postings">Проводки</div>
        <div class="tab" data-tab="users">Сотрудники</div>
        <div class="tab" data-tab="roster">Ростер цехов</div>
        <div class="tab" data-tab="nom">Номенклатура</div>
        <div class="tab" data-tab="catalogs">Справочники</div>
        <div class="tab" data-tab="export">Экспорт</div>
      </div>
    </div>
    <section class="active" id="tab-shifts"></section>
    <section id="tab-mixing"></section>
    <section id="tab-balance"></section>
    <section id="tab-postings"></section>
    <section id="tab-users"></section>
    <section id="tab-roster"></section>
    <section id="tab-nom"></section>
    <section id="tab-catalogs"></section>
    <section id="tab-export"></section>
  `;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
      tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  });

  const tabsEl = document.querySelector('.tabs');
  const tabsWrapEl = document.querySelector('.tabs-wrap');
  function updateTabsFade() {
    const atEnd = tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - 2;
    tabsWrapEl.classList.toggle('at-end', atEnd);
  }
  tabsEl.addEventListener('scroll', updateTabsFade);
  updateTabsFade();

  renderShiftsTab(stages);
  renderMixingTab(stages);
  renderBalanceTab(stages);
  renderPostingsTab(stages);
  renderUsersTab(stages);
  renderRosterTab(stages);
  renderNomTab();
  renderCatalogsTab();
  renderExportTab();
}

// --- Баланс между этапами ---
async function renderBalanceTab(stages) {
  const el = document.getElementById('tab-balance');
  const today = todayLocal();

  el.innerHTML = `
    <form class="inline export-form" id="balanceFilterForm">
      <label>С даты</label>
      <input type="date" name="date_from" value="${today}" required>
      <label>По дату</label>
      <input type="date" name="date_to" value="${today}" required>
      <button type="submit">Показать</button>
    </form>
    <div id="balanceResult"></div>
  `;

  // В баланс входят только поштучные этапы-документы (замесы меряются в кг, отдельная вкладка)
  const stageCols = stages.filter(s => s.formType === 'doc');

  async function loadBalance(dateFrom, dateTo) {
    const resultEl = document.getElementById('balanceResult');
    resultEl.innerHTML = `<div class="state-screen">Загрузка…</div>`;
    const resp = await (await fetch(`/api/admin/balance?date_from=${dateFrom}&date_to=${dateTo}`, { headers: authHeaders() })).json();
    const data = resp.items;

    if (data.length === 0) {
      resultEl.innerHTML = `<div class="state-screen">Нет данных за этот период</div>`;
      return;
    }

    const rowsHtml = data.map(nom => {
      const deltaByToStage = {};
      nom.deltas.forEach(d => { deltaByToStage[d.to_stage] = d; });

      const cells = stageCols.map(col => {
        const st = nom.per_stage.find(s => s.code === col.code);
        const d = deltaByToStage[col.code];
        let cls = '';
        let title = '';
        if (d && d.delta !== 0) {
          cls = d.delta > 0 ? 'cell-warn' : 'cell-over';
          title = d.delta > 0 ? `не хватает ${d.delta} относительно предыдущего этапа` : `лишнее ${Math.abs(d.delta)} относительно предыдущего этапа`;
        }
        const out = st ? st.out : 0;
        let sub = '';
        if (st && st.defect > 0) sub += `<div class="cell-sub bad">${col.code === 'molding' ? 'в глину' : 'брак'} −${st.defect}</div>`;
        if (st && st.repair > 0) sub += `<div class="cell-sub">ремонт ${st.repair}</div>`;
        if (st && st.grades) sub += `<div class="cell-sub">${Object.entries(st.grades).map(([g, q]) => `с${g}: ${q}`).join(' · ')}</div>`;
        return `<td class="${cls}" title="${title}">${out > 0 || sub ? (out > 0 ? out : '—') : '—'}${sub}</td>`;
      }).join('');

      return `<tr><td class="row-label">${esc(nom.nomenclature_name)}</td>${cells}</tr>`;
    }).join('');

    const totalCells = stageCols.map(col => {
      const sum = data.reduce((acc, nom) => {
        const s = nom.per_stage.find(x => x.code === col.code);
        return acc + (s ? s.out : 0);
      }, 0);
      return `<td>${sum > 0 ? sum : '—'}</td>`;
    }).join('');

    resultEl.innerHTML = `
      <div class="card"><div class="row1">Возврат в глину с формовки: ${resp.returned_to_clay} шт</div>
        <div class="row2">Разница «залито − годных» возвращается в глину автоматически</div></div>
      <div class="balance-table-wrap">
        <table class="balance-table">
          <thead>
            <tr>
              <th>Номенклатура</th>
              ${stageCols.map(c => `<th>${c.title}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
            <tr class="row-total"><td class="row-label">Итого</td>${totalCells}</tr>
          </tbody>
        </table>
      </div>
      <div class="row2" style="margin-bottom:8px;">В ячейке — сколько вышло с этапа дальше (годные).</div>
      <div class="balance-legend">
        <span class="legend-item"><span class="legend-swatch warn"></span> не хватает относительно предыдущего этапа</span>
        <span class="legend-item"><span class="legend-swatch over"></span> больше, чем должно быть</span>
      </div>
    `;
  }

  document.getElementById('balanceFilterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    loadBalance(fd.get('date_from'), fd.get('date_to'));
  });

  loadBalance(today, today);
}

// --- Смены (просмотр без экспорта) ---
async function renderShiftsTab(stages) {
  const el = document.getElementById('tab-shifts');
  const today = todayLocal();

  el.innerHTML = `
    <form class="inline export-form" id="shiftsFilterForm">
      <label>С даты</label>
      <input type="date" name="date_from" value="${today}" required>
      <label>По дату</label>
      <input type="date" name="date_to" value="${today}" required>
      <button type="submit">Показать</button>
    </form>
    <div id="shiftsResult"></div>
  `;

  async function loadShifts(dateFrom, dateTo) {
    const resultEl = document.getElementById('shiftsResult');
    resultEl.innerHTML = `<div class="state-screen">Загрузка…</div>`;

    let dayStatusHtml = '';
    if (dateFrom === dateTo) {
      const status = await (await fetch(`/api/admin/day-status/${dateFrom}`, { headers: authHeaders() })).json();
      dayStatusHtml = renderDayStatusBar(dateFrom, status);
    }

    const rows = await (await fetch(`/api/admin/entries?date_from=${dateFrom}&date_to=${dateTo}`, { headers: authHeaders() })).json();

    if (rows.length === 0) {
      resultEl.innerHTML = dayStatusHtml + `<div class="state-screen">Пока пусто — никто ничего не вносил за этот период</div>`;
      wireDayStatusButtons(dateFrom, dateTo);
      return;
    }

    // Группировка: этап -> сотрудник -> [{nomenclature, grade, quantity}]
    const byStage = {};
    for (const r of rows) {
      byStage[r.stage] = byStage[r.stage] || {};
      byStage[r.stage][r.employee_name] = byStage[r.stage][r.employee_name] || [];
      byStage[r.stage][r.employee_name].push(r);
    }

    const GRADE_LABELS = { '1': 'Сорт 1', '2': 'Сорт 2', brak: 'Брак', good: 'Годно', return: 'Возврат' };

    const html = stages
      .filter(s => byStage[s.code])
      .map(stage => {
        const employees = byStage[stage.code];

        // Итого по этапу — суммируем по номенклатуре(+сорт), фото и замесы в суммы не идут
        const stageTotals = {};
        Object.values(employees).flat().filter(r => !r.is_photo && !String(r.id).startsWith('batch-') && !String(r.id).startsWith('material-')).forEach(r => {
          const key = r.nomenclature_name + (r.grade ? ' · ' + (GRADE_LABELS[r.grade] || r.grade) : '');
          stageTotals[key] = (stageTotals[key] || 0) + r.quantity;
        });

        const employeeBlocks = Object.entries(employees).map(([name, items]) => {
          const rowsHtml = items.map(r => {
            if (r.is_photo) {
              return `
                <div class="item-line" data-entry-id="${r.id}">
                  <span>📷 Фото накладной${r.comment ? ' — ' + r.comment : ''}</span>
                  <span class="right">
                    <span class="entry-time">${r.created_at.slice(11, 16)}</span>
                    <button class="del-btn" data-del-entry="${r.id}" title="Удалить запись">✕</button>
                  </span>
                </div>
              `;
            }
            if (String(r.id).startsWith('batch-')) {
              return `
                <div class="item-line">
                  <span>${esc(r.nomenclature_name)}${r.quantity != null ? ': ' + r.quantity + ' кг' : ''}<div class="op-code">${esc(r.op_code || '')}</div></span>
                  <span class="right"><span class="entry-time">${r.created_at.slice(11, 16)}</span></span>
                </div>
              `;
            }
            return `
              <div class="item-line" data-entry-id="${r.id}">
                <span>${esc(r.nomenclature_name)}${r.grade && stage.legacy ? ' · ' + (GRADE_LABELS[r.grade] || r.grade) : ''} — ${esc(r.description != null ? r.description : r.quantity)}${r.drum_number ? ` (барабан ${r.drum_number}${r.batch_no ? ', замес ' + r.batch_no : ''})` : ''}${r.entered_by ? ` <span class="entry-time">· внёс: ${esc(r.entered_by)}</span>` : ''}<div class="op-code">${esc(r.op_code || '')}</div></span>
                <span class="right">
                  <span class="entry-time">${r.created_at.slice(11, 16)}</span>
                  <button class="del-btn" data-del-entry="${r.id}" title="Удалить запись">✕</button>
                </span>
              </div>
            `;
          }).join('');
          const lastTime = items[items.length - 1].created_at.slice(11, 16);
          return `
            <div class="employee-block">
              <div class="employee-name">${name} <span class="employee-time">посл. запись ${lastTime}</span></div>
              ${rowsHtml}
            </div>
          `;
        }).join('');

        const totalsBlock = Object.keys(stageTotals).length > 0 ? `
            <div class="stage-total">
              <div class="row2" style="margin-bottom:4px;">Итого по этапу (годные / вышло дальше)</div>
              ${Object.entries(stageTotals).map(([k, v]) => `
                <div class="item-line total"><span>${k}</span><span>${v}</span></div>
              `).join('')}
            </div>
        ` : '';

        return `
          <div class="card stage-card">
            <div class="row1">${stage.title}</div>
            ${employeeBlocks}
            ${totalsBlock}
          </div>
        `;
      }).join('');

    resultEl.innerHTML = dayStatusHtml + (html || `<div class="state-screen">Пока пусто</div>`);

    resultEl.querySelectorAll('[data-del-entry]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Удалить эту запись?')) return;
        await fetch(`/api/admin/entries/${btn.dataset.delEntry}`, { method: 'DELETE', headers: authHeaders() });
        loadShifts(dateFrom, dateTo);
      });
    });

    wireDayStatusButtons(dateFrom, dateTo);
  }

  function renderDayStatusBar(date, status) {
    if (status.closed) {
      return `
        <div class="day-status-bar closed">
          <span>🔒 День закрыт (${status.closed_at.slice(0, 16)})</span>
          <button id="reopenDayBtn">Переоткрыть</button>
        </div>
      `;
    }
    return `
      <div class="day-status-bar open">
        <span>День ещё открыт</span>
        <button id="closeDayBtn">Закрыть день</button>
      </div>
    `;
  }

  function wireDayStatusButtons(dateFrom, dateTo) {
    if (dateFrom !== dateTo) return;
    const closeBtn = document.getElementById('closeDayBtn');
    const reopenBtn = document.getElementById('reopenDayBtn');
    if (closeBtn) {
      closeBtn.addEventListener('click', async () => {
        if (!confirm(`Закрыть день ${dateFrom}? Новые записи за эту дату будут заблокированы у рабочих.`)) return;
        await fetch(`/api/admin/day-status/${dateFrom}/close`, { method: 'POST', headers: authHeaders() });
        loadShifts(dateFrom, dateTo);
      });
    }
    if (reopenBtn) {
      reopenBtn.addEventListener('click', async () => {
        if (!confirm(`Переоткрыть день ${dateFrom}? Рабочие снова смогут вносить и менять данные за эту дату.`)) return;
        await fetch(`/api/admin/day-status/${dateFrom}/reopen`, { method: 'POST', headers: authHeaders() });
        loadShifts(dateFrom, dateTo);
      });
    }
  }

  document.getElementById('shiftsFilterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    loadShifts(fd.get('date_from'), fd.get('date_to'));
  });

  loadShifts(today, today);
}

// --- Сотрудники ---
async function renderUsersTab(stages) {
  const el = document.getElementById('tab-users');
  const users = await (await fetch('/api/admin/users', { headers: authHeaders() })).json();

  el.innerHTML = `
    <form class="inline" id="userForm">
      <label>Telegram ID сотрудника</label>
      <input name="telegram_id" required placeholder="Например 123456789">
      <label>Имя</label>
      <input name="full_name" required placeholder="Иван Иванов">
      <label>Этапы (можно выбрать несколько)</label>
      <div class="stage-checkboxes">
        ${stages.filter(s => !s.legacy).map(s => `
          <label class="stage-checkbox-item">
            <input type="checkbox" name="stage" value="${s.code}"> ${s.title}
          </label>
        `).join('')}
      </div>
      <label><input type="checkbox" name="is_admin" style="width:auto;display:inline-block;margin-right:6px;">Администратор</label>
      <button type="submit">Добавить / обновить</button>
    </form>
    <div id="usersList">
      ${users.map(u => {
        const userStageCodes = u.stage.split(',').map(s => s.trim()).filter(Boolean);
        const userStageTitles = userStageCodes.map(code => stages.find(s => s.code === code)?.title || code).join(', ');
        return `
        <div class="card">
          <div class="row1">${u.full_name} ${u.is_admin ? '⭐' : ''}</div>
          <div class="row2">ID: ${u.telegram_id} · ${userStageTitles}</div>
          <div class="actions">
            <button class="danger" data-del-user="${u.telegram_id}">Удалить</button>
          </div>
        </div>
      `;
      }).join('') || '<div class="state-screen">Сотрудников пока нет</div>'}
    </div>
  `;

  el.querySelector('#userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const selectedStages = fd.getAll('stage');
    if (selectedStages.length === 0) {
      alert('Выбери хотя бы один этап');
      return;
    }
    await fetch('/api/admin/users', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        telegram_id: fd.get('telegram_id'),
        full_name: fd.get('full_name'),
        stage: selectedStages.join(','),
        is_admin: fd.get('is_admin') === 'on',
      }),
    });
    renderUsersTab(stages);
  });

  el.querySelectorAll('[data-del-user]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch(`/api/admin/users/${btn.dataset.delUser}`, { method: 'DELETE', headers: authHeaders() });
      renderUsersTab(stages);
    });
  });
}

// --- Ростер сотрудников по цехам (не имеют доступа в бот — вносит за них старший) ---
async function renderRosterTab(stages) {
  const el = document.getElementById('tab-roster');
  const rosterStageCodes = stages.filter(s => s.formType === 'doc').map(s => s.code);

  const employees = await (await fetch('/api/admin/employees', { headers: authHeaders() })).json();
  const today = todayLocal();
  const openShifts = await (await fetch(`/api/admin/shifts?status=open&date_from=${today}&date_to=${today}`, { headers: authHeaders() })).json();

  const stageTitle = code => stages.find(s => s.code === code)?.title || code;

  el.innerHTML = `
    <form class="inline" id="empForm">
      <label>Имя сотрудника</label>
      <input name="full_name" required placeholder="Например: Вовчик">
      <label>Этап (цех)</label>
      <select name="stage">
        ${rosterStageCodes.map(code => `<option value="${code}">${stageTitle(code)}</option>`).join('')}
      </select>
      <button type="submit">Добавить сотрудника</button>
    </form>

    ${openShifts.length > 0 ? `
      <div class="card">
        <div class="row1">Открытые смены сегодня (${openShifts.length})</div>
        <div class="row2" style="margin-bottom:8px;">Если старший забыл закрыть смену — можно закрыть силой</div>
        ${openShifts.map(s => `
          <div class="item-line">
            <span>${stageTitle(s.stage)} · открыл в ${s.opened_at.slice(11, 16)}</span>
            <button data-force-close="${s.id}" style="font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid #b3372c; color:#b3372c; background:none;">Закрыть силой</button>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div id="empList">
      ${rosterStageCodes.map(code => {
        const stageEmployees = employees.filter(e => e.stage === code);
        if (stageEmployees.length === 0) return '';
        return `
          <div class="card">
            <div class="row1">${stageTitle(code)}</div>
            ${stageEmployees.map(e => `
              <div class="item-line">
                <span>${e.full_name} ${e.active ? '' : '(скрыт)'}</span>
                <button data-toggle-emp="${e.id}" data-active="${e.active}" style="font-size:11px; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg);">${e.active ? 'Скрыть' : 'Показать'}</button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('')}
    </div>
  `;

  el.querySelector('#empForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    await fetch('/api/admin/employees', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ full_name: fd.get('full_name'), stage: fd.get('stage') }),
    });
    renderRosterTab(stages);
  });

  el.querySelectorAll('[data-toggle-emp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const active = btn.dataset.active === '1';
      await fetch(`/api/admin/employees/${btn.dataset.toggleEmp}`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify({ active: !active }),
      });
      renderRosterTab(stages);
    });
  });

  el.querySelectorAll('[data-force-close]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Закрыть эту смену силой? Старший больше не сможет вносить данные по ней.')) return;
      await fetch(`/api/admin/shifts/${btn.dataset.forceClose}/force-close`, { method: 'POST', headers: authHeaders() });
      renderRosterTab(stages);
    });
  });
}

// --- Замесы: матрица как в документе 1С (Замес 1..N + Сумма) ---
async function renderMixingTab(stages) {
  const el = document.getElementById('tab-mixing');
  const today = todayLocal();
  el.innerHTML = `
    <form class="inline export-form" id="mixingFilterForm">
      <label>Этап</label>
      <select name="stage">
        <option value="clay_mixing">Глина (замес)</option>
        <option value="glaze_mixing">Глазурь (замес)</option>
      </select>
      <label>С даты</label>
      <input type="date" name="date_from" value="${today}" required>
      <label>По дату</label>
      <input type="date" name="date_to" value="${today}" required>
      <button type="submit">Показать</button>
    </form>
    <div id="mixingResult"></div>
  `;

  const STATUS = { completed: 'завершён', in_progress: 'в процессе', cancelled: 'отменён' };

  async function load(stage, from, to) {
    const out = document.getElementById('mixingResult');
    out.innerHTML = `<div class="state-screen">Загрузка…</div>`;
    const groups = await (await fetch(`/api/admin/mixing-matrix?stage=${stage}&date_from=${from}&date_to=${to}`, { headers: authHeaders() })).json();
    if (groups.length === 0) { out.innerHTML = `<div class="state-screen">Замесов за этот период нет</div>`; return; }

    out.innerHTML = groups.map(g => `
      <div class="row1" style="margin:6px 2px;">${formatDMY(g.entry_date)} · Барабан №${g.drum_number}</div>
      <div class="matrix-wrap">
        <table class="matrix">
          <thead>
            <tr><th class="name">Номенклатура</th>${g.batches.map(b => `<th>Замес ${b.batch_no}</th>`).join('')}<th>Сумма</th></tr>
            <tr class="meta"><td class="name">Код / время</td>${g.batches.map(b => `<td>${esc(b.code)}<br>${b.time} · ${esc(b.employee_name)}${b.status !== 'completed' ? '<br>' + STATUS[b.status] : ''}</td>`).join('')}<td></td></tr>
          </thead>
          <tbody>
            ${g.rows.filter(r => r.sum > 0).map(r => `
              <tr><td class="name">${esc((r.article ? r.article + ' - ' : '') + r.name)}</td>${r.values.map(v => `<td>${v || ''}</td>`).join('')}<td><b>${r.sum}</b></td></tr>
            `).join('')}
            <tr class="total"><td class="name">Итого сырья, кг</td>${g.totals.map(t => `<td>${t}</td>`).join('')}<td>${g.totals_sum}</td></tr>
            <tr class="total"><td class="name">Выход, кг</td>${g.batches.map(b => `<td>${b.output_quantity == null ? '—' : b.output_quantity}</td>`).join('')}<td>${g.output_sum}</td></tr>
          </tbody>
        </table>
      </div>
    `).join('');
  }

  el.querySelector('#mixingFilterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    load(fd.get('stage'), fd.get('date_from'), fd.get('date_to'));
  });
  load('clay_mixing', today, today);
}

// --- Журнал проводок: у каждой операции уникальный код, отмены не стираются ---
async function renderPostingsTab(stages) {
  const el = document.getElementById('tab-postings');
  const today = todayLocal();
  const titleOf = code => (stages.find(s => s.code === code) || {}).title || code;

  el.innerHTML = `
    <form class="inline export-form" id="postingsForm">
      <div class="filter-row">
        <div><label>С даты</label><input type="date" name="date_from" value="${today}" required></div>
        <div><label>По дату</label><input type="date" name="date_to" value="${today}" required></div>
      </div>
      <label>Этап</label>
      <select name="stage">
        <option value="">Все этапы</option>
        ${stages.map(s => `<option value="${s.code}">${esc(s.title)}</option>`).join('')}
      </select>
      <label>Поиск по коду, сотруднику, содержанию</label>
      <input name="q" placeholder="Например: FM-20261030-0007">
      <label>Статус</label>
      <select name="status"><option value="">Все</option><option value="posted">Проведённые</option><option value="cancelled">Отменённые</option></select>
      <button type="submit">Показать</button>
    </form>
    <div id="postingsResult"></div>
  `;

  async function load(params) {
    const out = document.getElementById('postingsResult');
    out.innerHTML = `<div class="state-screen">Загрузка…</div>`;
    const qs = new URLSearchParams(params).toString();
    const rows = await (await fetch(`/api/admin/postings?${qs}`, { headers: authHeaders() })).json();
    if (rows.length === 0) { out.innerHTML = `<div class="state-screen">Проводок нет</div>`; return; }
    out.innerHTML = `<div class="row2" style="margin-bottom:8px;">Найдено: ${rows.length}</div>` + rows.map(p => `
      <div class="card posting ${p.status === 'cancelled' ? 'cancelled' : ''}">
        <div class="row1"><span class="code">${esc(p.op_code)}</span> ${p.status === 'cancelled' ? '· ❌ отменено' : ''}</div>
        <div class="row2">${esc(p.created_at)} · ${esc(titleOf(p.stage))}${p.parent_code ? ' · замес ' + esc(p.parent_code) : ''}</div>
        <div style="font-size:13px; margin-top:4px;">${esc(p.summary || '')}</div>
        <div class="row2">${p.actor_name ? 'Сотрудник: ' + esc(p.actor_name) : ''}${p.entered_by ? ' · внёс: ' + esc(p.entered_by) : ''}</div>
        ${p.status === 'cancelled' ? `<div class="row2" style="color:#b3372c;">Отменил: ${esc(p.cancelled_by || '—')} · ${esc(p.cancelled_at || '')}</div>` : ''}
      </div>
    `).join('');
  }

  el.querySelector('#postingsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const params = {};
    for (const [k, v] of fd.entries()) if (v) params[k] = v;
    load(params);
  });
  load({ date_from: today, date_to: today });
}

// --- Справочники: статичные списки (только просмотр) + заготовки под комплекты ГП / ТМЦ / п/ф ---
async function renderCatalogsTab() {
  const el = document.getElementById('tab-catalogs');
  const [materials, catalogs] = await Promise.all([
    fetch('/api/admin/materials', { headers: authHeaders() }).then(r => r.json()),
    fetch('/api/admin/catalogs', { headers: authHeaders() }).then(r => r.json()),

  const LABELS = { clay_mixing: 'Глина (замес) — барабаны 1–3', glaze_mixing: 'Глазурь (замес) — барабан всегда 1' };

    <div class="card">
      <div class="row1">${title}</div>
      ${rows.length === 0
        ? '<div class="row2">Структура готова, данные зальём позже</div>'
        : rows.map(render).join('')}
    </div>`;

  el.innerHTML = `
    <div class="card"><div class="row2">Списки сырья для замесов зафиксированы и через админку не меняются — только просмотр. Нужна правка — скажи разработчику.</div></div>
    ${['clay_mixing', 'glaze_mixing'].map(cat => `
      <div class="card">
        <div class="row1">${LABELS[cat]}</div>
        ${materials.filter(m => m.category === cat).map(m => `
          <div class="item-line"><span>${esc((m.article ? m.article + ' - ' : '') + m.name)}</span><span>${esc(m.unit)}</span></div>
        `).join('')}
      </div>`).join('')}
    ${placeholder('Комплекты готовой продукции', catalogs.kits, k => `<div class="item-line"><span>${esc(k.code || '')} ${esc(k.name)}</span><span>${k.items.length} поз.</span></div>`)}
    ${placeholder('Все ТМЦ', catalogs.tmc, t => `<div class="item-line"><span>${esc(t.code || '')} ${esc(t.name)}</span><span>${esc(t.unit)}</span></div>`)}
    ${placeholder('Полуфабрикаты (п/ф)', catalogs.semi_products, t => `<div class="item-line"><span>${esc(t.code || '')} ${esc(t.name)}</span><span>${esc(t.unit)}</span></div>`)}
  `;
}

// --- Экспорт ---
async function renderExportTab() {
  const el = document.getElementById('tab-export');
  const today = todayLocal();

  const openDays = await (await fetch('/api/admin/open-days', { headers: authHeaders() })).json();
  const openDaysHtml = openDays.length > 0
    ? `
      <div class="card open-days-list">
        <div class="row1">Незакрытые дни (${openDays.length})</div>
        <div class="row2" style="margin-bottom:8px;">Есть данные, но день ещё не закрыт</div>
        ${openDays.map(d => `
          <div class="item-line"><span>${d.entry_date}</span><span>${d.entries_count} записей</span></div>
        `).join('')}
      </div>
    `
    : `<div class="card"><div class="row2">Незакрытых дней нет — всё закрыто ✅</div></div>`;

  el.innerHTML = `
    ${openDaysHtml}
    <form class="inline export-form" id="exportForm">
      <label>С даты</label>
      <input type="date" name="date_from" value="${today}" required>
      <label>По дату</label>
      <input type="date" name="date_to" value="${today}" required>
      <button type="submit">Скачать Excel</button>
    </form>
  `;
  el.querySelector('#exportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const url = `/api/export?date_from=${fd.get('date_from')}&date_to=${fd.get('date_to')}`;
    const res = await fetch(url, { headers: authHeaders() });
    if (!res.ok) { alert('Ошибка экспорта'); return; }
    const blob = await res.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `otchet_${fd.get('date_from')}_${fd.get('date_to')}.xlsx`;
    link.click();
  });
}

boot();
